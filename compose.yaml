name: verda

services:
  backend:
    image: ${BACKEND_IMAGE:-verda-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      VERDA_ENV_FILE: /run/secrets/backend_env
      VERDA_DB_PATH: /data/verda.db
      LOCAL_SETTINGS_ENABLED: "false"
      REQUIRE_CLIENT_API_KEYS: "true"
      APP_PORT: "8000"
    secrets:
      - backend_env
    volumes:
      - verda_data:/data
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); assert d.get('status') == 'ok' and d.get('public_access_ready') is True"
      interval: 20s
      timeout: 8s
      start_period: 40s
      retries: 3
    stop_grace_period: 120s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: ${WEB_IMAGE:-verda-web:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in deploy.env}
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${PUBLISH_HTTP_PORT:-80}:80"
      - "${PUBLISH_HOST:-127.0.0.1}:${PUBLISH_HTTPS_PORT:-443}:443"
      - "${PUBLISH_HOST:-127.0.0.1}:${PUBLISH_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  app:

volumes:
  verda_data:
  caddy_data:
  caddy_config:

secrets:
  backend_env:
    file: ./backend/.env
